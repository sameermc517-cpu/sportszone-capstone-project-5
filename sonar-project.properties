# SonarQube project configuration for SportsZone
# Used by the sonar-scanner CLI, invoked from the Jenkins pipeline's
# "Code Quality Analysis" stage.

sonar.projectKey=sportszone-capstone
sonar.projectName=SportsZone Capstone
sonar.projectVersion=2.0

# Analyze all four Python services from one project. Each service's own
# test/coverage output is merged in because paths are relative to this file.
sonar.sources=team-service,player-service,match-service,web-frontend
sonar.tests=team-service/tests,player-service/tests,match-service/tests
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.db,e2e-tests/**

# Coverage reports produced by `pytest --cov-report=xml` in each service
# directory (see each service's pytest.ini). Jenkins runs the test stage
# before this analysis stage so these files exist by the time sonar-scanner runs.
sonar.python.coverage.reportPaths=team-service/coverage.xml,player-service/coverage.xml,match-service/coverage.xml

# JUnit-style test execution reports, also produced by pytest.
sonar.python.xunit.reportPath=team-service/test-results.xml,player-service/test-results.xml,match-service/test-results.xml

sonar.sourceEncoding=UTF-8
